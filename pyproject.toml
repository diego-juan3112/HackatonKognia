[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kognia-voice-agent"
version = "0.2.0"
description = "Base generica adaptable para el Kognia Challenge 2026"
requires-python = ">=3.11"
# Runtime minimo de Reto 01, igual a requirements.txt (mantener en sincronia).
# Lista estatica a proposito: Vercel instala desde pyproject.toml cuando hay
# pyproject.toml y requirements.txt (docs/11 §3). La base generica y las
# pruebas van en requirements-base.txt.
dependencies = [
    "langgraph>=1.2,<2.0",
    "langchain-core>=1.6,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "pyyaml>=6.0,<7.0",
]

[tool.vercel]
# FastAPI de Reto 01 en el runtime Python de Vercel (docs/11 §3). La misma ruta
# es la clave de "functions" en vercel.json.
entrypoint = "src.api.app_voice:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Sin esto `pytest` no encuentra los paquetes bajo src/ y la suite ni siquiera
# llega a importar. Era la causa de que nunca hubiera corrido.
pythonpath = ["src", "."]
testpaths = ["tests"]
# `-m "not integration"` por defecto: la suite tiene que correr sin Docker ni
# credenciales (R-16). Los tests contra Postgres se piden explicitamente
# con `pytest -m integration`.
addopts = "-q -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: requiere un PostgreSQL con pgvector accesible en DATABASE_URL",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
